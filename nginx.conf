# ==============================================================================
# Free4Chat Nginx Configuration Template
# Place this in /etc/nginx/sites-available/free4chat and symlink to sites-enabled
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com; # Replace with your domain or VPS IP

    # Redirect all HTTP traffic to HTTPS (recommended after certbot setup)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support (required for /api/sfu/ws and /api/room/agent-events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time WebSocket and SSE event streams
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for long-polling and persistent WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Maximum upload size for file/image attachments
        client_max_body_size 25M;
    }
}

